<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Research Agent</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #ddd; }
        .header h1 { margin: 0; color: #333; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #e0e0e0; border: none; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab.active { background: #007bff; color: white; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 5px 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: auto; }
        .result-area { margin-top: 20px; min-height: 200px; }
        .answer-box { background: #f8f9fa; padding: 20px; border-radius: 5px; border-left: 4px solid #007bff; white-space: pre-wrap; }
        .source-list { margin-top: 15px; }
        .source-item { padding: 10px; background: #f8f9fa; margin: 5px 0; border-radius: 4px; font-size: 13px; }
        .source-item a { color: #007bff; text-decoration: none; }
        .source-item a:hover { text-decoration: underline; }
        .job-status { padding: 15px; background: #f8f9fa; border-radius: 5px; margin: 10px 0; }
        .job-status.running { border-left: 4px solid #ffc107; }
        .job-status.completed { border-left: 4px solid #28a745; }
        .job-status.failed { border-left: 4px solid #dc3545; }
        .download-links a { display: inline-block; margin: 5px 10px 5px 0; padding: 8px 16px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .download-links a:hover { background: #218838; }
        .context-box { background: #f8f9fa; padding: 15px; border-radius: 5px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; }
        .stats { display: flex; gap: 30px; }
        .stat { text-align: center; padding: 20px; background: white; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-value { font-size: 32px; font-weight: bold; color: #007bff; }
        .stat-label { color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔬 Local AI Research Agent</h1>
        <div class="stats" hx-get="/api/stats" hx-trigger="load, every 30s">
            <div class="stat">
                <div class="stat-value" id="stat-vectors">-</div>
                <div class="stat-label">Vectors Indexed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-sources">-</div>
                <div class="stat-label">Sources</div>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('quick')">🔍 Quick Search</button>
        <button class="tab" onclick="showTab('ask')">❓ Ask KB</button>
        <button class="tab" onclick="showTab('research')">📚 Deep Research</button>
        <button class="tab" onclick="showTab('ingest')">📁 Ingest Docs</button>
        <button class="tab" onclick="showTab('manage')">⚙️ Manage</button>
    </div>

    <!-- Quick Search Tab -->
    <div id="tab-quick" class="tab-content active">
        <div class="card">
            <h3>Quick Search with Answer</h3>
            <form hx-post="/search" hx-target="#quick-results" hx-swap="innerHTML">
                <div class="form-group">
                    <label>Query</label>
                    <input type="text" name="query" placeholder="e.g., Vision transformers in computer vision" required style="width: 70%;">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" name="answer" value="true" checked id="quick-answer">
                    <label for="quick-answer">Generate answer with citations</label>
                </div>
                <button type="submit">Search</button>
            </form>
            <div id="quick-results" class="result-area"></div>
        </div>
    </div>

    <!-- Ask KB Tab -->
    <div id="tab-ask" class="tab-content">
        <div class="card">
            <h3>Ask Knowledge Base</h3>
            <form hx-post="/ask" hx-target="#ask-results" hx-swap="innerHTML">
                <div class="form-group">
                    <label>Question</label>
                    <input type="text" name="question" placeholder="e.g., What is the attention mechanism?" required style="width: 70%;">
                </div>
                <div class="form-group">
                    <label>Number of context chunks</label>
                    <input type="number" name="k" value="5" min="1" max="20" style="width: 100px;">
                </div>
                <button type="submit">Ask</button>
            </form>
            <div id="ask-results" class="result-area"></div>
        </div>
    </div>

    <!-- Deep Research Tab -->
    <div id="tab-research" class="tab-content">
        <div class="card">
            <h3>Deep Multi-Step Research</h3>
            <form hx-post="/research" hx-target="#research-status" hx-swap="innerHTML">
                <div class="form-group">
                    <label>Research Topic</label>
                    <input type="text" name="topic" placeholder="e.g., Vision transformers vs CNNs for medical imaging" required style="width: 70%;">
                </div>
                <div class="form-group">
                    <label>Iterations</label>
                    <input type="number" name="iterations" value="2" min="1" max="5" style="width: 100px;">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" name="paper" value="true" id="gen-paper">
                    <label for="gen-paper">Generate arXiv-style paper (LaTeX + PDF)</label>
                </div>
                <button type="submit">Start Research</button>
            </form>
            <div id="research-status" class="result-area"></div>
        </div>
    </div>

    <!-- Ingest Docs Tab -->
    <div id="tab-ingest" class="tab-content">
        <div class="card">
            <h3>Ingest Local Documents</h3>
            <p>Supported formats: PDF, Markdown, Python (.py), Jupyter (.ipynb), Text</p>
            <form hx-post="/api/ingest" hx-target="#ingest-result" hx-swap="innerHTML">
                <div class="form-group">
                    <label>Directory Path</label>
                    <input type="text" name="path" placeholder="e.g., ./papers or C:\Users\Documents\papers" required style="width: 70%;">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" name="recursive" value="true" checked id="recursive">
                    <label for="recursive">Recursive (include subdirectories)</label>
                </div>
                <button type="submit">Ingest Documents</button>
            </form>
            <div id="ingest-result" class="result-area"></div>
        </div>
    </div>

    <!-- Manage Tab -->
    <div id="tab-manage" class="tab-content">
        <div class="grid">
            <div class="card">
                <h3>📊 Knowledge Base Stats</h3>
                <button hx-get="/api/stats" hx-target="#stats-display" hx-swap="innerHTML" style="margin-bottom: 15px;">Refresh Stats</button>
                <div id="stats-display" hx-get="/api/stats" hx-trigger="load">
                    Loading...
                </div>
                <hr style="margin: 20px 0;">
                <button hx-post="/api/clear" hx-target="#stats-display" hx-swap="innerHTML" style="background: #dc3545;" onclick="return confirm('Clear all knowledge base data?')">🗑️ Clear Knowledge Base</button>
            </div>
            <div class="card">
                <h3>➕ Index Web Topic</h3>
                <form hx-post="/api/index" hx-target="#index-result" hx-swap="innerHTML">
                    <div class="form-group">
                        <label>Topic to Index</label>
                        <input type="text" name="query" placeholder="e.g., Transformer architectures" required style="width: 70%;">
                    </div>
                    <button type="submit">Index Topic</button>
                </form>
                <div id="index-result"></div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
    </script>
</body>
</html>
